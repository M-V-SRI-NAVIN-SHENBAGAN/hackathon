<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Hotel Management System</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/assets/css/site.css" />
<style>
  .notfound {
    min-height: 100vh; display: grid; place-items: center; text-align: center;
    padding: 40px 22px;
    background:
      radial-gradient(900px 400px at 80% -10%, rgba(201,162,39,.22), transparent 60%),
      linear-gradient(160deg, #091725 0%, #10293d 60%, #0a1a28 100%);
    color: #eaf1f6;
  }
  .notfound h1 { color: #fff; font-size: clamp(56px, 12vw, 120px); margin: 0; letter-spacing: -3px; }
  .notfound h1 em { color: var(--gold-soft); font-style: italic; }
  .notfound p { color: #c2d2de; max-width: 46ch; margin: 10px auto 26px; }
</style>
</head>
<body>
  <main class="notfound">
    <div>
      <h1>4<em>0</em>4</h1>
      <p>The page you were looking for is not here. The front desk can help you find your way back.</p>
      <a class="btn btn-gold" href="/">Back to the project</a>
    </div>
  </main>
</body>
</html>
